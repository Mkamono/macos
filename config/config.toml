[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.zshrc/activate" = { block = 'eval "$(~/.local/bin/mise activate zsh)"' }

[history]
exclude = ["~/.config/mise/miserc.toml"]

[bootstrap.packages]
"brew-cask:visual-studio-code" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:meetingbar" = "latest"
"brew-cask:slack" = "latest"
"brew:msedit" = "latest"

[bootstrap.packages."macos-app:rayvy"]
version = "0.2.0"
url = "https://github.com/Mkamono/rayvy/releases/download/v{{version}}/Rayvy-{{version}}-arm64.zip"
sha256 = "5b4663e33f8f5f7b40faa2c35084653d2f3f833db4a36dfb6f839f44c7bcbd1f"
artifact = "Rayvy.app"
os = "macos/arm64"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
show_all_files = true
sort_folders_first = true
preferred_view_style = "list"

# Window Tiling (macOS Sequoia+) shortcuts, rebound to Option+Control+Arrow.
# IDs: 237=Fill, 240=Tile Left Half, 241=Tile Right Half, 243=Tile Bottom Half.
# Plain Option+Arrow is left alone since it's the system-wide word-jump shortcut.
[bootstrap.macos.defaults."com.apple.symbolichotkeys".AppleSymbolicHotKeys."237"]
enabled = true
value = { parameters = [65535, 126, 786432], type = "standard" }

[bootstrap.macos.defaults."com.apple.symbolichotkeys".AppleSymbolicHotKeys."240"]
enabled = true
value = { parameters = [65535, 123, 786432], type = "standard" }

[bootstrap.macos.defaults."com.apple.symbolichotkeys".AppleSymbolicHotKeys."241"]
enabled = true
value = { parameters = [65535, 124, 786432], type = "standard" }

[bootstrap.macos.defaults."com.apple.symbolichotkeys".AppleSymbolicHotKeys."243"]
enabled = true
value = { parameters = [65535, 125, 786432], type = "standard" }

[tools]
bottom = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
terraform = "latest"

[env]
_.path = [
    "/Applications/Visual Studio Code.app/Contents/Resources/app/bin",
    "HOME/.local/bin"
]

[tasks.readme]
run = "gh repo read-file README.md --repo Mkamono/macos"

[tasks.init_miserc]
run = '''
file="$HOME/.config/mise/miserc.toml"

if [[ -e "$file" ]]; then
  echo "already exists"
  exit 1
fi

cat > "$file" <<'EOF'
auto_env = true

env = []
EOF
'''
