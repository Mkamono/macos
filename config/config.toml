[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.zprofile" = { mode = "track" }
"~/.zshrc/activate" = { block = 'eval "$(~/.local/bin/mise activate zsh)"' }

[bootstrap.packages]
"brew-cask:visual-studio-code" = "latest"

[bootstrap.services.mise-history]
builin = "history-watch"

[tools]
bottom = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
terraform = "latest"

[env]
_.path = [
    "/Applications/Visual Studio Code.app/Contents/Resources/app/bin",
    "HOME/.local/bin"
]

[tasks.readme]
run = "gh repo read-file README --repo Mkamono/macos"