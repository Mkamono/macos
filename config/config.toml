[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.zshrc/activate" = { block = 'eval "$(~/.local/bin/mise activate zsh)"' }

[history]
exclude = ["~/.config/mise/miserc.toml"]

[bootstrap.packages]
"brew-cask:visual-studio-code" = "latest"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
show_all_files = true
sort_folders_fiest = true
preferred_view_style = "list"

[tools]
bottom = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
terraform = "latest"

[env]
_.path = [
    "/Applications/Visual Studio Code.app/Contents/Resources/app/bin",
    "HOME/.local/bin"
]

[tasks.readme]
run = "gh repo read-file README.md --repo Mkamono/macos"

[tasks.profile]
description = "Show or select profiles for this machine"
usage = '''
arg "[profiles]" var=#true help="Profiles to enable"

complete "profiles" run='''
find "$HOME/.config/mise" -maxdepth 1 -name 'config.*.toml' \
  -exec basename {} \; |
sed -E 's/^config\.//; s/\.toml$//' |
sort
'''
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

config_dir="$HOME/.config/mise"

list_profiles() {
  find "$config_dir" -maxdepth 1 -name 'config.*.toml' \
    -exec basename {} \; |
    sed -E 's/^config\.//; s/\.toml$//' |
    sort
}

eval "profiles=(${usage_profiles:-})"

if (( ${#profiles[@]} == 0 )); then
  echo "Available profiles:"
  list_profiles | sed 's/^/  /'

  if [[ -f "$config_dir/miserc.toml" ]]; then
    echo
    echo "Current:"
    cat "$config_dir/miserc.toml"
  fi

  exit 0
fi

for profile in "${profiles[@]}"; do
  [[ -f "$config_dir/config.$profile.toml" ]] || {
    echo "Unknown profile: $profile" >&2
    exit 1
  }
done

{
  echo 'auto_env = true'
  printf 'env = ['
  sep=''
  for profile in "${profiles[@]}"; do
    printf '%s"%s"' "$sep" "$profile"
    sep=', '
  done
  echo ']'
} > "$config_dir/miserc.toml"

echo "Enabled: ${profiles[*]}"
'''
